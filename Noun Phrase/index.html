<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Phrase Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: calm "workbook" page. Reading content sits on quiet white cards; anything you can touch lives
   inside a tinted "Coba" activity panel with pressable controls. Block colours: soft blue premodifier ·
   solid tomato HEAD (the only saturated block, because it is the core) · soft green postmodifier. */
:root{
  --bg:#f5f6fa; --card:#ffffff; --soft:#f0f2f8; --line:#e0e4ee; --edge:#1d2140;
  --text:#1d2140; --muted:#5b6280;
  --pre:#2c4bc7; --pre-bg:#e9edff; --pre-bd:#b3c1f5;
  --head:#c7431f; --head-bg:#fff0eb;
  --post:#0a7650; --post-bg:#e0f4eb; --post-bd:#97d5ba;
  --act-bg:#eef1fd; --act-bd:#cbd3f6;
  --sun:#ffd666; --ok:#0a7650; --ok-bg:#e0f4eb; --bad:#c22f35; --bad-bg:#fdeceb;
  /* aliases used by scripts */
  --brass:var(--head); --paper:var(--text); --ink:var(--bg); --panel:var(--card); --panel2:var(--soft);
  --display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --press:3px 3px 0 var(--edge); --lift:0 1px 2px rgba(29,33,64,.06),0 4px 14px rgba(29,33,64,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:clamp(15.5px,1.4vw + 10px,18px);line-height:1.6;
  display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--pre);outline-offset:3px;border-radius:8px}
p{margin:0;max-width:62ch}
b,strong{font-weight:700}
.muted{color:var(--muted)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));
  background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{font-family:var(--display);font-weight:800;font-size:1.1rem;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand::before{content:"";width:20px;height:20px;border-radius:6px;background:linear-gradient(90deg,var(--pre-bd) 0 33%,var(--head) 33% 66%,var(--post-bd) 66%);border:1.5px solid var(--edge)}
.brand em{color:var(--head);font-style:normal}
.brand small{font-family:var(--body);font-weight:600;font-size:.75rem;color:var(--muted)}
.count{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{min-width:44px;height:40px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--text)}
.iconbtn:hover{border-color:var(--edge)}
.iconbtn svg{width:18px;height:18px}
.bar{position:absolute;left:0;bottom:-1px;height:3px;background:var(--head);border-radius:0 3px 3px 0;transition:width .35s ease}
@media (max-width:520px){.brand small,.iconbtn .lbl{display:none}}

/* ---------- stage ---------- */
#stage{position:relative;overflow:hidden}
.slide{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:clamp(22px,4vw,48px) calc(16px + env(safe-area-inset-right)) 36px calc(16px + env(safe-area-inset-left));display:none}
.slide.on{display:block;animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* slide header: 1 eyebrow → 2 title → 3 lead */
.sh{display:flex;flex-direction:column;gap:8px}
.eyebrow,.kicker{font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--head)}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(2.8rem,9vw,5.4rem)}
h2{font-size:clamp(1.65rem,4.2vw,2.5rem)}
h3{font-size:clamp(1.1rem,2.4vw,1.3rem)}
.lead{font-size:1.04em;color:var(--muted)}
.lead b{color:var(--text)}
.acc{color:var(--head)}

/* reading surfaces: quiet */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,2.4vw,22px);box-shadow:var(--lift)}
.card-title{font-weight:800;display:block;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:800;color:var(--muted)}
.note{border-radius:var(--r);padding:14px 16px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--muted);display:flex;flex-direction:column;gap:4px}
.note.warn{border-left-color:var(--bad)} .note.warn b:first-child{color:var(--bad)}
.note.key{border-left-color:var(--head);background:var(--head-bg)} .note.key b:first-child{color:var(--head)}
.footnote{font-size:.86rem;color:var(--muted)}

/* activity panel: everything touchable lives here */
.activity{background:var(--act-bg);border:1.5px solid var(--act-bd);border-radius:20px;padding:clamp(14px,2.4vw,20px);display:flex;flex-direction:column;gap:14px}
.act-head{display:flex;gap:10px;align-items:flex-start}
.act-head p{font-weight:600;font-size:.95rem;padding-top:2px}
.act-tag{flex:none;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--pre);border-radius:999px;padding:4px 10px}
.act-body{display:flex;flex-direction:column;gap:12px}
.activity .card{box-shadow:none}

/* ---------- phrase blocks ---------- */
.seg{display:inline-block;padding:.1em .5em;border-radius:9px;margin:.14em .08em;font-weight:700;line-height:1.4;border:1.5px solid}
.seg.pre{color:var(--pre);background:var(--pre-bg);border-color:var(--pre-bd)}
.seg.head{color:#fff;background:var(--head);border-color:var(--head)}
.seg.post{color:var(--post);background:var(--post-bg);border-color:var(--post-bd)}
.seg.det{color:var(--text);background:var(--card);border-color:var(--line)}
.np{color:var(--head);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;font-weight:600;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1.5px solid}
.legend i.pre{background:var(--pre-bg);border-color:var(--pre)} .legend i.head{background:var(--head);border-color:var(--head)} .legend i.post{background:var(--post-bg);border-color:var(--post)}

.formula{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:stretch}
.fblock{border-radius:var(--r);padding:14px 16px;border:1.5px solid;display:flex;flex-direction:column;gap:4px}
.fblock .t{font-family:var(--display);font-weight:800;font-size:1.25rem}
.fblock span:last-child{font-size:.88rem;color:var(--text)}
.fblock.pre{background:var(--pre-bg);border-color:var(--pre-bd)} .fblock.pre .t{color:var(--pre)}
.fblock.head{background:var(--head);border-color:var(--head);color:#fff} .fblock.head span:last-child{color:#fff}
.fblock.post{background:var(--post-bg);border-color:var(--post-bd)} .fblock.post .t{color:var(--post)}
.plus{align-self:center;font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--muted)}
@media (max-width:680px){.formula{grid-template-columns:1fr}.plus{display:none}}

/* ---------- controls: pressable ---------- */
.btn{min-height:46px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--edge);background:var(--card);font-weight:700;box-shadow:var(--press);transition:transform .08s,box-shadow .08s,background .15s}
.btn:hover{background:var(--soft)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.primary{background:var(--head);border-color:var(--edge);color:#fff}
.btn.primary:hover{background:#b33a19}
.btn.ghost{background:var(--card)}
.btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.opt{width:100%;text-align:left;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--edge);background:var(--card);display:flex;gap:12px;align-items:flex-start;font-weight:600;box-shadow:var(--press);transition:transform .08s,box-shadow .08s}
.opt:active:not([disabled]){transform:translate(3px,3px);box-shadow:none}
.opt:hover:not([disabled]){background:var(--soft)}
.opt .L{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);font-weight:800;font-size:.85rem;color:var(--text)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);animation:pop .3s}
.opt.ok .L{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);animation:shake .3s}
.opt.no .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default;box-shadow:none}
@keyframes pop{50%{transform:scale(1.02)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:12px;padding:12px 14px;font-size:.95rem;display:none;border-left:5px solid}
.fb.show{display:block;animation:in .25s ease both}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}

.words{display:flex;flex-wrap:wrap;gap:8px}
.w{min-height:44px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--edge);background:var(--card);font-weight:600;box-shadow:2px 2px 0 var(--edge)}
.w:active{transform:translate(2px,2px);box-shadow:none}
.w.ok{background:var(--head);border-color:var(--head);color:#fff;box-shadow:none}
.w.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);animation:shake .3s}
.w:disabled{cursor:default}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.tbl td:first-child{font-weight:700;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:560px){
  .tbl.tstack thead{display:none}
  .tbl.tstack tr{display:grid;grid-template-columns:1fr;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
  .tbl.tstack tr:last-child{border-bottom:0}
  .tbl.tstack td{border:0;padding:0 4px}
  .tbl.tstack td:nth-child(2){color:var(--muted);font-size:.88rem}
}

/* order chain */
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.link{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--pre-bg);border:1px solid var(--pre-bd);color:var(--pre);font-weight:700;font-size:.85rem}
.link i{font-style:normal;font-size:.72rem;opacity:.7}
.link.h{background:var(--head);color:#fff;border-color:var(--head)}
.link.d{background:var(--card);color:var(--text);border-color:var(--line)}
.link.plain{background:var(--card);color:var(--text);border-color:var(--line)}
.arrow{color:var(--muted);font-weight:700}

/* builder */
.slot{min-height:60px;border:2px dashed var(--act-bd);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--card)}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.slot.no{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.tile{min-height:46px;padding:8px 16px;border-radius:10px;border:1.5px solid var(--edge);background:var(--card);color:var(--text);font-weight:700;box-shadow:var(--press);transition:transform .08s}
.tile:active{transform:translate(3px,3px);box-shadow:none}
.tile.used{opacity:.25;pointer-events:none;box-shadow:none}
.meta{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;color:var(--muted)}

/* flip cards */
.flip{perspective:900px;min-height:150px;border:0;background:none;padding:0;text-align:left}
.flip .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .5s ease;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;padding:14px 16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--edge);box-shadow:var(--press);background:var(--card)}
.face.b{background:var(--ok-bg);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok);transform:rotateY(180deg)}
.face .ph{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.3}
.face .more{margin-top:auto;font-size:.8rem;font-weight:700;color:var(--pre)}
.tag{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.tag.bad{color:var(--bad)} .tag.good{color:var(--ok)}
.strike{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px;color:var(--muted)}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--edge);background:var(--card);font-weight:700;font-size:.9rem;box-shadow:2px 2px 0 var(--edge)}
.tab[aria-selected="true"]{background:var(--edge);color:#fff;box-shadow:none;transform:translate(2px,2px)}
.showcase{font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,3.4vw,1.8rem);line-height:1.35}

/* cover */
.cover{min-height:100%;display:flex;align-items:center}
.cover .wrap{gap:24px}
.hl{background:linear-gradient(transparent 60%,var(--sun) 60%);padding:0 .06em}
.stack{display:flex;flex-wrap:wrap;gap:10px}
.brick{font-family:var(--display);font-weight:800;font-size:clamp(1.25rem,4.2vw,2.2rem);padding:.3em .7em;border-radius:14px;border:1.5px solid var(--edge);box-shadow:4px 4px 0 var(--edge);text-align:left;transition:transform .08s}
.brick:active{transform:translate(4px,4px);box-shadow:none}
.brick small{display:block;font-family:var(--body);font-size:.4em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.brick.pre{background:var(--pre-bg);color:var(--pre)}
.brick.head{background:var(--head);color:#fff}
.brick.post{background:var(--post-bg);color:var(--post)}
.brick[aria-pressed="true"]{outline:3px solid var(--sun);outline-offset:3px}
.tipbox{min-height:3.4em;font-size:.95rem}

/* goals */
.goals{list-style:none;margin:0;padding:0}
.goals li{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:baseline}
.goals li:last-child{border-bottom:0}
.goals .n{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--head)}

/* recap */
.rc{border-top:5px solid var(--muted)}
.rc.pre{border-top-color:var(--pre)} .rc.head{border-top-color:var(--head)} .rc.post{border-top-color:var(--post)}
.bigphrase{font-size:clamp(1.15rem,3.2vw,1.6rem)}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{width:24px;height:8px;border-radius:4px;background:var(--line)}
.pip.cur{background:var(--edge)} .pip.ok{background:var(--ok)} .pip.no{background:var(--bad)}
.score{font-family:var(--display);font-weight:800;font-size:clamp(4rem,14vw,6.5rem);color:var(--head);line-height:1}
.opts{display:flex;flex-direction:column;gap:12px}
.qstem b{color:var(--head);font-weight:800;background:linear-gradient(transparent 62%,#ffe8a6 62%);padding:0 .08em}

/* ---------- bottom nav ---------- */
.nav{display:flex;align-items:center;gap:10px;padding:10px calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));background:var(--card);border-top:1px solid var(--line)}
.nav .btn{min-width:54px}
.dots{flex:1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:var(--line)}
.dot.on{background:var(--head);width:24px;border-radius:5px}
.navlbl{display:none}
.navmid{display:none;font-size:.85rem;font-weight:700;color:var(--muted)}
@media (max-width:620px){.dots{display:none}.nav{justify-content:space-between}.nav .navlbl{display:inline}.navmid{display:block}}

/* modal */
.modal{position:fixed;inset:0;background:rgba(29,33,64,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.show{display:flex}
.modal .card{max-width:420px;display:flex;flex-direction:column;gap:12px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;color:inherit}
a.btn.primary{color:#fff}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">Phrase <em>Builder</em> <small class="muted" style="font-family:var(--body);font-size:.72rem">· Noun Phrase</small></div>
  <span class="count" id="count">1 / 17</span>
  <a class="iconbtn" id="newtab" href="#" target="_blank" rel="noopener" style="display:none;text-decoration:none" aria-label="Buka di tab baru">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span class="lbl">Tab baru</span>
  </a>
  <button class="iconbtn" id="fsBtn" aria-label="Layar penuh">
    <svg id="fsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl" id="fsLbl">Layar penuh</span>
  </button>
  <div class="bar" id="bar"></div>
</header>

<main id="stage"></main>

<nav class="nav" aria-label="Navigasi slide">
  <button class="btn ghost" id="prev" aria-label="Slide sebelumnya">‹ <span class="navlbl">Kembali</span></button>
  <div class="dots" id="dots"></div>
  <span class="navmid" id="navmid">Geser ← →</span>
  <button class="btn primary" id="next" aria-label="Slide berikutnya"><span class="navlbl">Lanjut</span> ›</button>
</nav>

<div class="modal" id="fsModal" role="dialog" aria-modal="true" aria-labelledby="fsTitle">
  <div class="card">
    <h3 id="fsTitle">Layar penuh tidak tersedia di sini</h3>
    <p class="muted">Perangkat atau halaman sematan (misalnya Google Sites di iPhone) tidak mengizinkan mode layar penuh. Buka slide di tab baru agar tampil memenuhi layar.</p>
    <div class="row">
      <a class="btn primary" id="fsOpen" href="#" target="_blank" rel="noopener">Buka di tab baru</a>
      <button class="btn" id="fsClose">Tutup</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>
<script>
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const S=(t,c)=>`<span class="seg ${c}">${t}</span>`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LEGEND=`<div class="legend"><span><i class="pre"></i>Premodifier</span><span><i class="head"></i>Head noun</span><span><i class="post"></i>Postmodifier</span></div>`;


function confetti(n=120){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;

  const r=()=>{out.innerHTML=(rc?`<span class="eyebrow" style="color:var(--post)">Relative clause · ada verb</span><p>the ${S('book','head')}${S('which <u>is</u> on the table','post')}</p><p>a ${S('woman','head')}${S('who <u>wears</u> a red hat','post')}</p>`:`<span class="eyebrow" style="color:var(--post)">Prepositional phrase · tanpa verb</span><p>the ${S('book','head')}${S('on the table','post')}</p><p>a ${S('woman','head')}${S('with a red hat','post')}</p>`);btn.textContent=rc?'Kembali ke prepositional phrase':'Ubah ke relative clause'};
  btn.onclick=()=>{rc=!rc;r()};r();
}});

slides.push({html:`<div class="wrap">

  <div class="card"><span class="card-title">Langkah menentukan</span>
    <ol class="steps"><li><span>Temukan head noun.</span></li><li><span>Lihat kata di belakang head noun.</span></li><li><span>Diawali <b>who / whom / which / that / whose / where</b> + ada verb → <b style="color:var(--post)">adjective clause</b>.</span></li><li><span>Hanya preposition + noun phrase, atau tanpa tambahan → <b>noun phrase sederhana</b>.</span></li></ol></div>
  ${ACT('Baca frasa berwarna di setiap kalimat, lalu pilih jawabanmu.','<div style="display:flex;flex-direction:column;gap:10px" id="det"></div>')}
</div>`,init(el){
  const D=[['She has a small red bag.','a small red bag',false,'Hanya premodifier.'],['The boy in the garden is my brother.','The boy in the garden',false,'Hanya prepositional phrase.'],['The boy who is in the garden is my brother.','The boy who is in the garden',true,'<i>who is in the garden</i> punya verb <i>is</i>.'],['I like the song that she sings.','the song that she sings',true,'<i>that she sings</i> punya subject + verb.']];

    const fb=$('.fb',c);$$('[data-v]',c).forEach(b=>b.onclick=()=>{const ok=(b.dataset.v==='1')===yes;fb.className='fb show '+(ok?'ok':'no');fb.innerHTML=(ok?'<b>Tepat.</b> ':'<b>Belum tepat.</b> ')+(yes?'Ada adjective clause: ':'Tidak ada clause: ')+why});box.appendChild(c)});

/* 17 quiz */
const Q=[
 {q:'What is the head noun in the phrase "<b>the tall boy with a blue cap</b>"?',o:['tall','boy','cap','blue'],a:'boy',e:'Head noun adalah <i>boy</i>. <i>tall</i> = adjective, <i>cap</i> ada di dalam prepositional phrase <i>with a blue cap</i>, <i>blue</i> = adjective milik <i>cap</i>.'},
 {q:'What is the head noun in the phrase "<b>the student who won the English contest</b>"?',o:['Rina','student','contest','English'],a:'student',e:'Head noun adalah <i>student</i>. <i>contest</i> dan <i>English</i> berada di dalam relative clause <i>who won the English contest</i>. <i>Rina</i> tidak ada di dalam frasa yang ditanyakan.'},
 {q:'Which noun phrase has the correct order?',o:['a red small ball','a small red ball','a ball small red','small a red ball'],a:'a small red ball',e:'Size → Colour: <i>small</i> sebelum <i>red</i>.'},
 {q:'Which noun phrase has the correct order?',o:['a leather Italian jacket','an Italian leather jacket','a jacket Italian leather','leather an Italian jacket'],a:'an Italian leather jacket',e:'Origin → Material: <i>Italian</i> sebelum <i>leather</i>. <i>an</i> dipakai karena <i>Italian</i> berbunyi vokal.'},
 {q:'In the sentence "The students <b>in the library</b> are studying quietly," the bold part is …',o:['a premodifier','a prepositional phrase as postmodifier','a relative clause','a head noun'],a:'a prepositional phrase as postmodifier',e:'<i>in the library</i> = preposition + noun phrase, tanpa verb sendiri, berada setelah head noun <i>students</i>.'},
 {q:'Which sentence contains an adjective (relative) clause?',o:['The old man in the garden is my uncle.','The man who lives next door is a doctor.','She wants a small wooden box.','My new bag is on the chair.'],a:'The man who lives next door is a doctor.',e:'<i>who lives next door</i> memiliki verb <i>lives</i> dan diawali relative pronoun <i>who</i>. Kalimat <i>The old man in the garden…</i> hanya memakai prepositional phrase; <i>a small wooden box</i> dan <i>My new bag…</i> hanya memakai premodifier atau prepositional phrase.'},
 {q:'Which sentence does <b>NOT</b> contain an adjective (relative) clause?',o:['The book that I borrowed is thick.','The girl whose bag is red is Dina.','I like the song which she sings.','I like the green bag on the table.'],a:'I like the green bag on the table.',e:'<i>on the table</i> hanya prepositional phrase. Tiga kalimat lain memuat adjective clause: <i>that I borrowed</i>, <i>whose bag is red</i>, <i>which she sings</i>.'},
 {q:'Choose the correct word: "I met a woman ___ speaks five languages."',o:['who','which','in','whose'],a:'who',e:'Head noun <i>woman</i> adalah orang dan relative pronoun menjadi subject dari <i>speaks</i> → <i>who</i>. <i>which</i> untuk benda, <i>whose</i> diikuti noun, <i>in</i> tidak bisa diikuti verb.'},
 {q:'Which sentence is <b>INCORRECT</b>?',o:['The book on the table is mine.','The book which on the table is mine.','The book which is on the table is mine.','The book that is on the table is mine.'],a:'The book which on the table is mine.',e:'Relative pronoun <i>which</i> harus diikuti verb (<i>which is on the table</i>) atau dihapus (<i>the book on the table</i>).'},
 {q:'In the sentence "Rina bought <b>a beautiful silk scarf</b>," what is the function of the bold noun phrase?',o:['subject','object of the verb','object of a preposition','complement'],a:'object of the verb',e:'<i>a beautiful silk scarf</i> berada sesudah verb <i>bought</i> dan menjadi benda yang dibeli. Urutannya juga benar: Opinion → Material.'}
];
slides.push({html:`<div class="wrap" id="quiz"></div>`,init(el){
  const box=$('#quiz',el);let set,i,score,res;
  const start=()=>{set=Q.map(x=>({...x,o:shuffle(x.o)}));i=0;score=0;res=[];render()};
  const pips=()=>`<div class="pips">${set.map((_,k)=>`<span class="pip ${res[k]===true?'ok':res[k]===false?'no':k===i?'cur':''}"></span>`).join('')}</div>`;
  const render=()=>{
    if(i>=set.length){const msg=score>=9?'Luar biasa! Kamu sudah jago membangun noun phrase.':score>=7?'Bagus! Tinjau lagi soal yang masih salah.':score>=5?'Cukup. Ulangi slide head noun dan postmodifier, lalu coba lagi.':'Ayo pelajari ulang materinya, lalu coba lagi.';
      if(score>=7)setTimeout(()=>confetti(160),150);box.innerHTML=`<div class="kicker">Hasil Kuis</div><div class="score">${score}<span style="font-size:.4em;color:var(--muted)"> / ${set.length}</span></div>${pips()}<p class="lead">${msg}</p><div class="row"><button class="btn primary" id="again">Ulangi kuis (opsi diacak ulang)</button><button class="btn" data-go="3">Tinjau materi</button></div>`;
      $('#again',box).onclick=start;bindGo(box);return}
    const x=set[i];
    box.innerHTML=`<div class="qhead"><span class="kicker">Kuis · Soal ${i+1} dari ${set.length}</span><span class="muted" style="font-size:.85rem">Skor: ${score}</span></div>${pips()}
      <h3 class="qstem" style="font-family:var(--body);font-weight:500;font-size:clamp(1.05rem,2.4vw,1.3rem);line-height:1.45">${x.q}</h3>
      <div class="opts">${x.o.map((o,k)=>`<button class="opt" data-o="${k}"><span class="L">${'ABCD'[k]}</span><span>${o}</span></button>`).join('')}</div>
      <div class="fb" id="qfb"></div><div class="row"><button class="btn primary" id="qnext" style="display:none">${i<set.length-1?'Soal berikutnya ›':'Lihat hasil ›'}</button></div>`;
    $$('[data-o]',box).forEach(b=>b.onclick=()=>{const pick=x.o[+b.dataset.o],ok=pick===x.a;res[i]=ok;if(ok)score++;
      $$('[data-o]',box).forEach(bb=>{bb.disabled=true;if(x.o[+bb.dataset.o]===x.a)bb.classList.add('ok')});if(!ok)b.classList.add('no');
      const f=$('#qfb',box);f.className='fb show '+(ok?'ok':'no');f.innerHTML=`<b>${ok?'Benar!':'Kurang tepat.'}</b> Jawaban: <b>${x.a}</b>. ${x.e}`;
      $('.pips',box).outerHTML=pips();$('#qnext',box).style.display='inline-flex';$('#qnext',box).focus({preventScroll:true});
      f.scrollIntoView({behavior:'smooth',block:'nearest'})});
    $('#qnext',box).onclick=()=>{i++;render();el.scrollTop=0};
  };
  start();
}});

/* ================= engine ================= */
const stage=$('#stage'),dots=$('#dots');let cur=0;
slides.forEach((s,k)=>{const sec=document.createElement('section');sec.className='slide';sec.setAttribute('aria-label',`Slide ${k+1}`);sec.innerHTML=s.html;stage.appendChild(sec);s.el=sec;if(s.init)s.init(sec);
  const d=document.createElement('button');d.className='dot';d.setAttribute('aria-label',`Ke slide ${k+1}`);d.onclick=()=>go(k);dots.appendChild(d)});
function bindGo(root){$$('[data-go]',root).forEach(b=>b.onclick=()=>go(+b.dataset.go))}
bindGo(document);
function go(k){k=Math.max(0,Math.min(slides.length-1,k));slides[cur].el.classList.remove('on');cur=k;const el=slides[k].el;el.classList.add('on');el.scrollTop=0;
  $$('.dot').forEach((d,j)=>d.classList.toggle('on',j===k));$('#count').textContent=`${k+1} / ${slides.length}`;$('#navmid').textContent=`${k+1} / ${slides.length}`;
  $('#bar').style.width=`${(k+1)/slides.length*100}%`;$('#prev').disabled=k===0;$('#next').disabled=k===slides.length-1;
  try{history.replaceState(null,'',`#s${k+1}`)}catch(e){}}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);else if(e.key==='f'||e.key==='F')toggleFS()});
/* swipe */
let sx=0,sy=0,st=0;
stage.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
stage.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&Date.now()-st<700){if(e.target.closest('.scroll'))return;go(cur+(dx<0?1:-1))}},{passive:true});

/* fullscreen */
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const url=location.href.split('#')[0];
$('#fsOpen').href=url;$('#newtab').href=url;if(inFrame)$('#newtab').style.display='inline-flex';
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsOK=()=>!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
function fallback(){$('#fsModal').classList.add('show');$('#fsOpen').focus()}
function toggleFS(){const d=document,el=d.documentElement;
  if(fsEl()){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!req||!fsOK()){fallback();return}
  try{const p=req.call(el,{navigationUI:'hide'});if(p&&p.catch)p.catch(fallback)}catch(e){fallback()}}
function fsUI(){const on=!!fsEl();$('#fsLbl').textContent=on?'Keluar':'Layar penuh';$('#fsBtn').setAttribute('aria-label',on?'Keluar dari layar penuh':'Layar penuh');
  $('#fsIcon').innerHTML=on?'<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>':'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>'}
$('#fsBtn').onclick=toggleFS;document.addEventListener('fullscreenchange',fsUI);document.addEventListener('webkitfullscreenchange',fsUI);
$('#fsClose').onclick=()=>$('#fsModal').classList.remove('show');
$('#fsModal').onclick=e=>{if(e.target.id==='fsModal')$('#fsModal').classList.remove('show')};

/* start (supports #s3 links) */
const m=location.hash.match(/^#s(\d+)$/);go(m?(+m[1]-1):0);
</script>
